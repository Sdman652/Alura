<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog tech</title>
    <style>
        body {
            background-color: #509bf1;
        }

        header {
            background-color: #82b12f;
            color: #000000;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        
        .background {
            width: 100%;
            height: 100%;
            position: fixed;
            padding: 0px;
            z-index: -1;
            object-fit: cover;
            filter: blur(10px);
        }

        main { 
            background-color: #509bf1;
            border-radius: 0px 0px 20px 20px;
            color: #000000;
            text-align: left;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        h2 {
            color: #000000;
        }

        .logo {
            max-width: 100px;
            max-height: 100px;
        }
    </style>
</head>

<body>

    <img src="source/gato.jpg" class="background">

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre linux e outras coisas.</p>
    </header>
    <main>
        <div>
            <img src="linux.jpg" alt="Logotipo conceitual de tecnologia e educacao" class="logo">
            <h2>Meu primeiro post do mundo unix</h2>
            <p class="artigo-autor">Por: sdmjk</p>
            <p>Bem vindo ao meu blog de coisas sobre Linux</p>
        </div>
    </main>

</body>

</html>
